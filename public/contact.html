<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ｜宙辺 -SORABE-</title><meta name="description" content="宙辺 -SORABE-への宿泊・予約お問い合わせ内容を入力できます。"><meta name="theme-color" content="#071014"><meta name="google-analytics-id" content=""><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="canonical" href="https://nittakaduki-blip.github.io/sorabe/contact.html"><link rel="stylesheet" href="assets/tailwind-built-v15.css"><link rel="stylesheet" href="assets/sorabe-pages-v15.css"><script src="assets/site-analytics-v15.js" defer></script></head>
<body class="sorabe-subpage bg-moon text-night antialiased"><header class="border-b px-6 py-6 md:px-12"><a href="./" class="page-brand font-serif text-2xl tracking-[.18em]">宙辺 <small class="font-sans text-[9px]">SORABE</small></a><nav class="page-utility" aria-label="ページ案内"><a href="./">TOP</a></nav></header><main class="mx-auto max-w-4xl px-6 py-20 md:px-10 md:py-28"><p class="text-xs tracking-[.3em] text-night/50">CONTACT</p><h1 class="mt-6 font-serif text-4xl tracking-widest md:text-6xl">お問い合わせ</h1><p class="mt-8 max-w-2xl font-serif leading-8 text-night/70">必要事項をご入力ください。送信ボタンを押すと、お使いのメールアプリに内容を引き継ぎます。メールアプリ側で送信を完了してください。</p><form id="contact-form" class="mt-14 grid gap-7" novalidate><div class="contact-field"><label for="name">お名前 *</label><input id="name" name="name" autocomplete="name" required></div><div class="contact-field"><label for="email">メールアドレス *</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="grid gap-7 md:grid-cols-2"><div class="contact-field"><label for="date">ご希望日</label><input id="date" name="date" type="date"></div><div class="contact-field"><label for="guests">宿泊人数</label><input id="guests" name="guests" type="number" min="1" max="21"></div></div><div class="contact-field"><label for="type">お問い合わせ内容</label><select id="type" name="type"><option>空室・予約について</option><option>設備・オプションについて</option><option>その他</option></select></div><div class="contact-field"><label for="message">メッセージ *</label><textarea id="message" name="message" rows="7" required></textarea></div><label class="flex items-start gap-3 text-sm leading-7"><input id="privacy" type="checkbox" required class="mt-1"><span><a href="privacy.html" class="underline">プライバシーポリシー</a>を確認し、入力内容をメールで送ることに同意します。</span></label><button type="submit" class="sorabe-link justify-self-start bg-night px-8 py-4 text-white" data-track="contact_mail_open">送信内容をメールで開く →</button><p id="contact-status" class="contact-status text-sm leading-7" role="status" aria-live="polite">メールアプリを開きました。内容をご確認のうえ、送信してください。</p></form></main><footer class="bg-night px-6 py-12 text-xs text-white/60 md:px-12"><div class="mx-auto flex max-w-4xl flex-wrap gap-6"><a href="./">トップ</a><a href="reservation.html">ご予約</a><a href="legal.html">特定商取引法に基づく表記</a><a href="terms.html">宿泊約款・利用規約</a><a href="privacy.html">プライバシーポリシー</a></div></footer><script>document.querySelector('#contact-form').addEventListener('submit',event=>{event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const data=new FormData(form);const lines=[`お名前：${data.get('name')}`,`メール：${data.get('email')}`,`ご希望日：${data.get('date')||'未定'}`,`宿泊人数：${data.get('guests')||'未定'}`,`お問い合わせ種別：${data.get('type')}`,'',String(data.get('message'))];location.href=`mailto:roofllc0415@gmail.com?subject=${encodeURIComponent('SORABE お問い合わせ')}&body=${encodeURIComponent(lines.join('\n'))}`;document.querySelector('#contact-status').classList.add('is-visible')});</script></body></html>
